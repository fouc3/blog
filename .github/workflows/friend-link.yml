name: 友链申请处理

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  manage-friend-link:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, '友链申请')) ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '通过验证' && github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '重新验证' && (github.event.comment.user.login == github.event.issue.user.login || github.event.comment.user.login == github.repository_owner)) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '删除友链') && github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '删除友链并拉黑' && github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '拉黑' && github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      - name: 检测仓库类型并 Checkout 目标仓库
        id: detect-repo
        run: |
          if [ -f "_config.yml" ] && [ -d "source/_data" ]; then
            echo "is_hexo=true" >> $GITHUB_OUTPUT
            echo "is_hexo=true" >> $GITHUB_ENV
          else
            echo "is_hexo=false" >> $GITHUB_OUTPUT
            echo "is_hexo=false" >> $GITHUB_ENV
            
            if [ -n "${{ secrets.PUT_TOKEN }}" ] && [ -n "${{ secrets.TARGET_REPOSITORY }}" ]; then
              IFS='/' read -r OWNER REPO <<< "${{ secrets.TARGET_REPOSITORY }}"
              git clone --depth=1 https://x-access-token:${{ secrets.PUT_TOKEN }}@github.com/${{ secrets.TARGET_REPOSITORY }}.git target_repo
              cd target_repo
              echo "target_dir=$(pwd)" >> $GITHUB_OUTPUT
              echo "target_dir=$(pwd)" >> $GITHUB_ENV
            else
              echo "未配置 PUT_TOKEN 和 TARGET_REPOSITORY secrets"
              exit 1
            fi
          fi

      - name: 判断操作类型
        id: action-type
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentBody = context.eventName === 'issue_comment' ? context.payload.comment.body : '';
            const isOwner = context.eventName === 'issue_comment' ? context.payload.comment.user.login === context.repo.owner : false;

            let actionType = 'add';
            let friendName = '';

            if (context.eventName === 'issues') {
              actionType = 'add';
            } else if (commentBody === '通过验证' && isOwner) {
              actionType = 'add';
            } else if (commentBody === '重新验证') {
              actionType = 'add';
            } else if (commentBody.startsWith('删除友链') && isOwner) {
              actionType = 'delete';
              const parts = commentBody.split(' ');
              friendName = parts.slice(1).join(' ').trim();
            } else if (commentBody === '删除友链并拉黑' && isOwner) {
              actionType = 'delete_and_blacklist';
            } else if (commentBody === '拉黑' && isOwner) {
              actionType = 'blacklist';
            }

            core.setOutput('action_type', actionType);
            core.setOutput('friend_name', friendName);

      - name: 解析 Issue 内容
        id: parse-issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue;
            if (context.eventName === 'issue_comment') {
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              issue = response.data;
            } else {
              issue = context.payload.issue;
            }

            const body = issue.body || '';
            const userLogin = issue.user.login;

            // 检查是否是仓库所有者提出的 Issue（用于拉黑豁免）
            const isOwnerIssue = userLogin === context.repo.owner;

            function extract(key) {
              const pattern = new RegExp('### ' + key + '\\s*\\n\\s*(.*?)(?=\\n###|\\Z)', 's');
              const m = body.match(pattern);
              if (m) {
                let val = m[1].trim();
                if (val === 'No response' || val === '_No response_') return '';
                return val.replace(/^`|`$/g, '').trim();
              }
              return '';
            }

            const name = extract('网站名称');
            const urlRaw = extract('网站链接');
            const avatar = extract('网站头像 URL');
            const desc = extract('网站描述');
            const siteshot = extract('网站预览图 URL');

            core.setOutput('name', name);
            core.setOutput('url_raw', urlRaw);
            core.setOutput('avatar', avatar);
            core.setOutput('desc', desc);
            core.setOutput('siteshot', siteshot);
            core.setOutput('user_login', userLogin);
            core.setOutput('is_owner_issue', isOwnerIssue ? 'true' : 'false');

      - name: 检查黑名单
        id: check-blacklist
        if: steps.action-type.outputs.action_type == 'add' || steps.action-type.outputs.action_type == 'blacklist'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const userLogin = '${{ steps.parse-issue.outputs.user_login }}';
            const urlRaw = '${{ steps.parse-issue.outputs.url_raw }}';
            const discussionNumber = process.env.BLACKLIST_DISCUSSION_NUMBER;

            // 仓库所有者豁免
            if (userLogin === context.repo.owner) {
              core.setOutput('blacklisted', 'false');
              core.setOutput('exempt', 'true');
              core.setOutput('exempt_note', String.fromCharCode(10) + String.fromCharCode(10) + '> 💡 此 Issue 由仓库所有者创建，已豁免黑名单检查。');
              return;
            }

            if (!discussionNumber) {
              core.setOutput('blacklisted', 'false');
              core.setOutput('exempt', 'false');
              core.setOutput('exempt_note', '');
              return;
            }

            let userId = '';
            try {
              const userResponse = await github.request('GET /users/{username}', {
                username: userLogin
              });
              userId = userResponse.data.id.toString();
            } catch (e) {
              core.setOutput('blacklisted', 'false');
              core.setOutput('exempt', 'false');
              core.setOutput('exempt_note', '');
              return;
            }

            let hostname = '';
            try {
              if (urlRaw) {
                hostname = new URL(urlRaw).hostname;
              }
            } catch (e) {}

            try {
              const discussion = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      body
                      comments(first: 100) {
                        nodes {
                          body
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: parseInt(discussionNumber)
              });

              const comments = discussion.repository.discussion.comments.nodes;
              const allText = comments.map(c => c.body).join('\n');

              const idPattern = new RegExp('\\| 被拉黑人 ID \\| (\\d+) \\|', 'g');
              let match;
              while ((match = idPattern.exec(allText)) !== null) {
                if (match[1] === userId) {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `## 🚫 操作被拒绝\n\n用户 ${userLogin} (ID: ${userId}) 已在黑名单中。`
                  });
                  core.setOutput('blacklisted', 'true');
                  return;
                }
              }

              if (hostname) {
                const urlPattern = new RegExp('\\| 目标网站 URL \\| ([^|]+) \\|', 'g');
                while ((match = urlPattern.exec(allText)) !== null) {
                  try {
                    const blacklistedHost = new URL(match[1].trim()).hostname;
                    if (blacklistedHost === hostname) {
                      await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `## 🚫 操作被拒绝\n\n网站 ${hostname} 已在黑名单中。`
                      });
                      core.setOutput('blacklisted', 'true');
                      return;
                    }
                  } catch (e) {}
                }
              }
            } catch (e) {}

            core.setOutput('blacklisted', 'false');
            core.setOutput('exempt', 'false');
            core.setOutput('exempt_note', '');
        env:
          BLACKLIST_DISCUSSION_NUMBER: ${{ secrets.BLACKLIST_DISCUSSION_NUMBER }}

      - name: 处理删除友链
        if: (steps.action-type.outputs.action_type == 'delete' || steps.action-type.outputs.action_type == 'delete_and_blacklist') && steps.check-blacklist.outputs.blacklisted != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const actionType = '${{ steps.action-type.outputs.action_type }}';
            let friendName = '${{ steps.action-type.outputs.friend_name }}';
            const parsedName = '${{ steps.parse-issue.outputs.name }}';

            if (actionType === 'delete_and_blacklist' || !friendName) {
              friendName = parsedName;
            }

            if (!friendName) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ❌ 删除失败\n\n无法确定要删除的友链名称。'
              });
              return;
            }

            const isHexo = process.env.is_hexo === 'true';
            const targetDir = process.env.target_dir || '';
            const workDir = isHexo ? '.' : targetDir;
            const filePath = `${workDir}/source/_data/link.yml`;

            let content = fs.readFileSync(filePath, 'utf-8');

            const NL = String.fromCharCode(10);
            const lines = content.split(NL);
            let newLines = [];
            let skip = false;
            let found = false;

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (line.match(/^\s*- name:\s*(.*)/) && line.includes(friendName)) {
                skip = true;
                found = true;
                continue;
              }
              if (skip) {
                if (line.match(/^\s*- name:/) || line.match(/^- class_name:/) || line.match(/^link_list:/)) {
                  skip = false;
                  newLines.push(line);
                }
                continue;
              }
              newLines.push(line);
            }

            if (!found) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ 删除失败\n\n未找到名为 "${friendName}" 的友链。`
              });
              return;
            }

            content = newLines.join(NL);
            fs.writeFileSync(filePath, content, 'utf-8');

            const commitDir = isHexo ? '.' : targetDir;
            const execOpts = { cwd: commitDir };

            execSync('git config user.name "github-actions[bot]"', execOpts);
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"', execOpts);
            execSync('git add source/_data/link.yml', execOpts);
            execSync('git commit -m "删除友链 ' + friendName + '"', execOpts);

            if (isHexo) {
              execSync('git push', execOpts);
            } else {
              execSync('git push origin HEAD:main', execOpts);
            }

            // 更新标签
            const labelsToRemove = ['已通过', '申请中', '网站不可达', '无效'];
            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              }).catch(() => {});
            }
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['已删除']
            });

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ 友链已删除\n\n已成功删除友链：${friendName}`
            });

            core.setOutput('deleted', 'true');
            core.setOutput('friend_name', friendName);
        env:
          is_hexo: ${{ steps.detect-repo.outputs.is_hexo }}
          target_dir: ${{ steps.detect-repo.outputs.target_dir }}

      - name: 处理拉黑
        if: (steps.action-type.outputs.action_type == 'blacklist' || steps.action-type.outputs.action_type == 'delete_and_blacklist') && steps.check-blacklist.outputs.blacklisted != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const userLogin = '${{ steps.parse-issue.outputs.user_login }}';
            const url = '${{ steps.parse-issue.outputs.url_raw }}';
            const friendName = '${{ steps.action-type.outputs.friend_name }}' || '${{ steps.parse-issue.outputs.name }}';
            const discussionNumber = process.env.BLACKLIST_DISCUSSION_NUMBER;
            const operator = context.repo.owner;
            const exemptNote = '${{ steps.check-blacklist.outputs.exempt_note }}';

            if (!discussionNumber) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ❌ 拉黑失败\n\n未配置 BLACKLIST_DISCUSSION_NUMBER 环境变量。'
              });
              return;
            }

            let userId = '';
            try {
              const userResponse = await github.request('GET /users/{username}', {
                username: userLogin
              });
              userId = userResponse.data.id;
            } catch (e) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "## ❌ 拉黑失败\n\n无法获取用户 " + userLogin + " 的信息。"
              });
              return;
            }

            const NL = String.fromCharCode(10);
            const commentBody = "## 🚫 拉黑记录" + NL + NL + "| 字段 | 值 |" + NL + "|------|-----|" + NL + "| 来源 Issue | #" + context.issue.number + " |" + NL + "| 被拉黑人名称 | " + userLogin + " |" + NL + "| 被拉黑人 ID | " + userId + " |" + NL + "| 目标网站 URL | " + url + " |" + NL + "| 操作人 | " + operator + " |" + NL + "| 友链名称 | " + friendName + " |" + NL + NL + "> 由 GitHub Actions 自动添加";

            // 先获取 discussion 的 node_id
            let discussionNodeId;
            try {
              const queryResult = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      id
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: parseInt(discussionNumber)
              });
              discussionNodeId = queryResult.repository.discussion.id;
            } catch (e) {
              const discussionUrl = "https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/discussions/" + discussionNumber;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "## ❌ 拉黑失败\n\n无法获取 Discussion #" + discussionNumber + " 的信息。\n\n" + discussionUrl
              });
              return;
            }

            // 添加评论到 discussion
            try {
              await github.graphql(`
                mutation($discussionId: ID!, $body: String!) {
                  addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                    comment {
                      id
                    }
                  }
                }
              `, {
                discussionId: discussionNodeId,
                body: commentBody
              });
            } catch (e) {
              const discussionUrl = "https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/discussions/" + discussionNumber;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "## ⚠️ 拉黑记录添加失败\n\n无法在 Discussion #" + discussionNumber + " 中添加记录。请手动添加：\n\n" + discussionUrl + "\n\n代码块内容：\n" + commentBody
              });
              return;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## ✅ 已拉黑\n\n已在拉黑记录中添加：" + userLogin + " (" + userId + ")" + exemptNote
            });
        env:
          BLACKLIST_DISCUSSION_NUMBER: ${{ secrets.BLACKLIST_DISCUSSION_NUMBER }}

      - name: 清理历史标签并添加申请中
        if: steps.action-type.outputs.action_type == 'add' && steps.check-blacklist.outputs.blacklisted != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentBody = context.eventName === 'issue_comment' ? context.payload.comment.body : '';
            const isManualApproval = commentBody === '通过验证' && context.payload.comment.user.login === context.repo.owner;
            
            if (!isManualApproval) {
              const labelsToRemove = ['网站不可达', '无效', '已通过'];
              for (const label of labelsToRemove) {
                await github.rest.issues.removeLabel({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                }).catch(() => {});
              }
              
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['申请中']
              });
            }

      - name: 验证必填字段
        id: validate-fields
        if: steps.action-type.outputs.action_type == 'add' && steps.check-blacklist.outputs.blacklisted != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const name = '${{ steps.parse-issue.outputs.name }}';
            const urlRaw = '${{ steps.parse-issue.outputs.url_raw }}';
            const avatar = '${{ steps.parse-issue.outputs.avatar }}';

            if (!name || !urlRaw || !avatar) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: '申请中'
              }).catch(() => {});
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['无效']
              });
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ❌ 友链申请失败\n\n请确保已填写**网站名称**、**网站链接**和**网站头像 URL**，然后编辑此 Issue 重新触发。'
              });
              core.setOutput('valid', 'false');
              return;
            }

            let url;
            try {
              url = new URL(urlRaw).origin.replace(/\/$/, '');
            } catch (e) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: '申请中'
              }).catch(() => {});
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['无效']
              });
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ URL 格式无效\n\n"${urlRaw}" 不是有效的 URL，请提供完整的 URL（包含 https://）。`
              });
              core.setOutput('valid', 'false');
              return;
            }

            core.setOutput('valid', 'true');
            core.setOutput('url', url);

      - name: 验证网站有效性
        id: validate-website
        if: steps.action-type.outputs.action_type == 'add' && steps.check-blacklist.outputs.blacklisted != 'true' && steps.validate-fields.outputs.valid == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          URL="${{ steps.validate-fields.outputs.url }}"
          
          if [ "$COMMENT_USER" = "$REPO_OWNER" ] && [ "$COMMENT_BODY" = "通过验证" ]; then
            echo "skip_validation=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          for i in 1 2 3; do
            RESULT=$(curl -o /dev/null -s -w "%{http_code}\n%{redirect_url}" --max-time 10 "$URL" 2>/dev/null || echo "")
            if [ -n "$RESULT" ]; then
              STATUS_CODE=$(echo "$RESULT" | head -n1)
              REDIRECT_URL=$(echo "$RESULT" | tail -n1)
              break
            fi
            if [ $i -eq 3 ]; then
              echo "unreachable=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          
          echo "status_code=$STATUS_CODE" >> $GITHUB_OUTPUT
          if [ -n "$REDIRECT_URL" ]; then
            echo "redirect=true" >> $GITHUB_OUTPUT
          else
            echo "redirect=false" >> $GITHUB_OUTPUT
          fi

      - name: 处理验证失败
        if: |
          steps.action-type.outputs.action_type == 'add' && 
          steps.check-blacklist.outputs.blacklisted != 'true' &&
          steps.validate-fields.outputs.valid == 'true' && 
          steps.validate-website.outputs.skip_validation != 'true' &&
          (steps.validate-website.outputs.unreachable == 'true' || steps.validate-website.outputs.status_code != '200' || steps.validate-website.outputs.redirect == 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const unreachable = '${{ steps.validate-website.outputs.unreachable }}' === 'true';
            const statusCode = '${{ steps.validate-website.outputs.status_code }}';
            const redirect = '${{ steps.validate-website.outputs.redirect }}' === 'true';
            const url = '${{ steps.validate-fields.outputs.url }}';

            await github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '申请中'
            }).catch(() => {});
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['网站不可达']
            });

            if (unreachable) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ⚠️ 网站不可达\n\n无法访问 ${url}，请检查网站是否正常运行。\n\n修复后可回复"重新验证"再次尝试。`
              });
            } else {
              const owner = context.repo.owner;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ⚠️ 需要人工审核\n\n网站验证结果：\n- 状态码：${statusCode || '未知'}\n- 重定向：${redirect ? '是' : '否'}\n\n@${owner} 请人工审核此友链申请。\n- 如需通过，请回复"通过验证"\n- 如需重新验证，请回复"重新验证"\n\n> ⚠️ 注意："通过验证"仅仓库所有者可用`
              });
            }

      - name: 添加友链
        if: |
          steps.action-type.outputs.action_type == 'add' &&
          steps.check-blacklist.outputs.blacklisted != 'true' &&
          ((steps.validate-fields.outputs.valid == 'true' && steps.validate-website.outputs.skip_validation == 'true') ||
          (steps.validate-fields.outputs.valid == 'true' && steps.validate-website.outputs.unreachable != 'true' && steps.validate-website.outputs.status_code == '200' && steps.validate-website.outputs.redirect != 'true'))
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const name = '${{ steps.parse-issue.outputs.name }}';
            const url = '${{ steps.validate-fields.outputs.url }}';
            const avatar = '${{ steps.parse-issue.outputs.avatar }}';
            const desc = '${{ steps.parse-issue.outputs.desc }}';
            const siteshot = '${{ steps.parse-issue.outputs.siteshot }}';
            const isHexo = process.env.is_hexo === 'true';
            const targetDir = process.env.target_dir || '';

            const workDir = isHexo ? '.' : targetDir;
            const filePath = `${workDir}/source/_data/link.yml`;

            let content = fs.readFileSync(filePath, 'utf-8');

            if (content.includes(url)) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: '申请中'
              }).catch(() => {});
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ℹ️ 友链已存在\n\n该链接已在友链列表中，无需重复添加。`
              });
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
              return;
            }

            const NL = String.fromCharCode(10);
            let newFriend = "    - name: " + name + NL + "      link: " + url + "/" + NL + "      avatar: " + avatar + NL + "      descr: " + (desc || name);
            if (siteshot) {
              newFriend += NL + "      siteshot: " + siteshot;
            }

            const linkListMatch = content.match(/link_list:\s*\n([\s\S]*?)(?=\n- class_name:|\n#|$)/);
            if (linkListMatch) {
              const linkListContent = linkListMatch[1];
              const lastEntryMatch = linkListContent.match(/[\s\S]*- name:[\s\S]*?(?=\n    - name:|\n- class_name:|\n#|$)/g);
              if (lastEntryMatch) {
                const lastEntry = lastEntryMatch[lastEntryMatch.length - 1];
                const insertPos = content.indexOf(lastEntry) + lastEntry.length;
                content = content.slice(0, insertPos) + NL + newFriend + content.slice(insertPos);
              } else {
                content = content.replace(/(link_list:\s*\n)/, '$1' + newFriend + NL);
              }
            } else {
              content = content.replace(/(link_list:\s*\n)/, '$1' + newFriend + NL);
            }
            fs.writeFileSync(filePath, content, 'utf-8');

            const commitDir = isHexo ? '.' : targetDir;
            const execOpts = { cwd: commitDir };

            execSync('git config user.name "github-actions[bot]"', execOpts);
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"', execOpts);
            execSync('git add source/_data/link.yml', execOpts);
            execSync('git commit -m "更新友链 ' + name + '"', execOpts);

            if (isHexo) {
              execSync('git push', execOpts);
            } else {
              execSync('git push origin HEAD:main', execOpts);
            }

            await github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '申请中'
            }).catch(() => {});
            await github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '网站不可达'
            }).catch(() => {});
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['已通过']
            });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ 友链申请已通过！\n\n感谢申请！友链已成功添加。\n\n📋 **友链信息**\n- 名称：${name}\n- 链接：${url}\n- 头像：${avatar}\n- 描述：${desc || '无'}\n${siteshot ? '- 预览图：' + siteshot : ''}\n\n请在你的友链页面确认已添加本站友链。感谢支持！🎉`
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
        env:
          is_hexo: ${{ steps.detect-repo.outputs.is_hexo }}
          target_dir: ${{ steps.detect-repo.outputs.target_dir }}
